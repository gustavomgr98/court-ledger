<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294A"/>
      <stop offset="1" stop-color="#0C1930"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7D42"/>
      <stop offset="1" stop-color="#E85A1C"/>
    </linearGradient>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedSquare)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- backboard glow line -->
    <rect x="0" y="118" width="512" height="6" fill="#22345A"/>

    <!-- rim (behind ball on left side, in front on right, to suggest depth) -->
    <g>
      <!-- net -->
      <g stroke="#5FE0D0" stroke-width="4" opacity="0.85" fill="none">
        <line x1="150" y1="150" x2="168" y2="252"/>
        <line x1="196" y1="146" x2="204" y2="252"/>
        <line x1="244" y1="144" x2="240" y2="252"/>
        <line x1="292" y1="144" x2="278" y2="252"/>
        <line x1="340" y1="146" x2="316" y2="252"/>
        <line x1="386" y1="150" x2="352" y2="252"/>
        <path d="M168 200 L204 198" />
        <path d="M204 198 L240 197" />
        <path d="M240 197 L278 197" />
        <path d="M278 197 L316 198" />
        <path d="M316 198 L352 200" />
        <path d="M168 252 L204 252" />
        <path d="M204 252 L240 252" />
        <path d="M240 252 L278 252" />
        <path d="M278 252 L316 252" />
        <path d="M316 252 L352 252" />
      </g>
      <!-- rim ring -->
      <ellipse cx="256" cy="150" rx="140" ry="26" fill="none" stroke="#FF6A28" stroke-width="14"/>
      <ellipse cx="256" cy="150" rx="140" ry="26" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
    </g>

    <!-- basketball, mid-drop through the rim -->
    <g transform="translate(256 318)">
      <circle r="118" fill="url(#ball)"/>
      <g stroke="#0C1930" stroke-width="7" fill="none" opacity="0.55">
        <line x1="0" y1="-118" x2="0" y2="118"/>
        <line x1="-118" y1="0" x2="118" y2="0"/>
        <path d="M -118 0 A 118 118 0 0 1 0 -118"/>
        <path d="M 0 -118 A 118 118 0 0 1 118 0"/>
        <path d="M 118 0 A 118 118 0 0 1 0 118"/>
        <path d="M 0 118 A 118 118 0 0 1 -118 0"/>
      </g>
      <ellipse cx="-42" cy="-48" rx="34" ry="20" fill="#FFFFFF" opacity="0.18"/>
    </g>

    <!-- motion lines -->
    <g stroke="#31D6C4" stroke-width="8" stroke-linecap="round" opacity="0.5">
      <line x1="108" y1="230" x2="108" y2="272"/>
      <line x1="88" y1="250" x2="88" y2="282"/>
    </g>
    <g stroke="#31D6C4" stroke-width="8" stroke-linecap="round" opacity="0.5">
      <line x1="404" y1="230" x2="404" y2="272"/>
      <line x1="424" y1="250" x2="424" y2="282"/>
    </g>
  </g>
</svg>
