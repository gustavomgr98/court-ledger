<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBlue" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2A4A78"/>
      <stop offset="45%" stop-color="#14283F"/>
      <stop offset="100%" stop-color="#080F18"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="24%" cy="14%" r="70%">
      <stop offset="0%" stop-color="#4E7BB8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4E7BB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="60%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="ledgerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9558"/>
      <stop offset="100%" stop-color="#FF6B2C"/>
    </linearGradient>
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="lineShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF7A3D" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgBlue)"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <path d="M-20 300 Q256 220 532 300" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.07"/>
  <path d="M-20 340 Q256 260 532 340" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.06"/>

  <rect x="34" y="34" width="444" height="444" rx="88" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>

  <text x="256" y="248" text-anchor="middle" font-family="Oswald, 'Helvetica Neue', Arial, sans-serif" font-weight="600"
    font-size="80" letter-spacing="6" fill="#F5F7FA" filter="url(#textShadow)">COURT</text>
  <text x="256" y="336" text-anchor="middle" font-family="Oswald, 'Helvetica Neue', Arial, sans-serif" font-weight="700"
    font-size="86" letter-spacing="3" fill="url(#ledgerGrad)" filter="url(#textShadow)">LEDGER</text>

  <g filter="url(#lineShadow)">
    <rect x="150" y="368" width="70" height="4" rx="2" fill="#FF7A3D"/>
    <rect x="292" y="368" width="70" height="4" rx="2" fill="#FF7A3D"/>
  </g>

  <rect width="512" height="512" rx="112" fill="url(#vignette)"/>
</svg>
